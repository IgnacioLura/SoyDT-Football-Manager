server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # SoyDT.Api container, reachable by its compose service name.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        # ProcessHub (SignalR) needs the Upgrade/Connection pair to negotiate
        # WebSocket instead of falling back to long-polling.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static assets (player photos, etc.): serve the real file or a real
    # 404 — do not fall back to index.html here, otherwise every missing
    # photo request downloads the entire SPA shell as text/html. Must be
    # declared before the SPA catch-all below to take precedence.
    location /static/ {
        try_files $uri =404;
    }

    # SPA fallback: client-side routing (react-router-dom) owns any path
    # that isn't a real static asset.
    location / {
        try_files $uri /index.html;
    }
}
